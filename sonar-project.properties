# sonar-project.properties
# Configuracion del analisis de SonarQube Cloud (SonarCloud).
# El SonarScanner lee este archivo desde la raiz del repo durante el CI.

# Identificacion del proyecto en SonarCloud (copiados del dashboard).
sonar.projectKey=Maxzett_devsecops-grupo-6
sonar.organization=maxzett

# Codigo de la aplicacion a analizar y carpeta de tests.
sonar.sources=app
sonar.tests=tests

# Reporte de coverage que genera Playwright (Paso 3).
# Las rutas SF: del lcov apuntan a app/app.js, que cae dentro de sonar.sources.
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Excluir del analisis dependencias, reportes y artefactos generados.
sonar.exclusions=node_modules/**,playwright-report/**,test-results/**,coverage/**
