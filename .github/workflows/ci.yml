
# Actividad 6 - GitHub Actions.
# Integración continua de la SPA con Playwright.

name: Playwright Tests CI

# Se ejecuta al abrir o actualizar un PR dirigido a main.
on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  test:

    # Nombre del check requerido por la protección de main.
    name: Run Playwright Tests

    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:

      # 1. Descargar el código del repositorio.
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configurar Node.js.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3. Reutilizar las descargas de npm entre ejecuciones.
      - name: Cachear dependencias de npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node20-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node20-npm-

      # 4. Instalar las dependencias del proyecto.
      - name: Instalar dependencias
        run: npm ci

      # 5. Instalar Chromium, Firefox y dependencias de Linux.
      - name: Instalar navegadores de Playwright
        run: npx playwright install --with-deps

      # 6. Ejecutar las pruebas de la Actividad 5.
      - name: Ejecutar pruebas automatizadas
        run: npm test

      # 7. Publicar el reporte HTML como artifact.
      # También se intenta publicar si fallan los tests.
      - name: Publicar reporte HTML
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
          if-no-files-found: error