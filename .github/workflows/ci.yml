
# Actividad 6 - GitHub Actions.
# Integración continua de la SPA con Playwright.

name: Playwright Tests CI

# Se ejecuta al abrir o actualizar un PR dirigido a main.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  test:

    # Nombre del check requerido por la protección de main.
    name: Run Playwright Tests

    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:

      # 1. Descargar el código del repositorio.
      #    fetch-depth: 0 trae TODO el historial de git. SonarCloud lo necesita
      #    para detectar el "new code" (lo nuevo del PR) y para el blame.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Configurar Node.js.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3. Reutilizar las descargas de npm entre ejecuciones.
      - name: Cachear dependencias de npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node20-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node20-npm-

      # 4. Instalar las dependencias del proyecto.
      - name: Instalar dependencias
        run: npm ci

      # 5. Instalar Chromium, Firefox y dependencias de Linux.
      - name: Instalar navegadores de Playwright
        run: npx playwright install --with-deps

      # 6. Ejecutar las pruebas de la Actividad 5.
      #    Al terminar, el global teardown genera coverage/lcov.info.
      - name: Ejecutar pruebas automatizadas
        run: npm test

      # 7. Analizar el código con SonarQube Cloud (SonarScanner).
      #    Corre DESPUÉS de los tests: si "npm test" falla, este step no se
      #    ejecuta (y el coverage ni siquiera se habría generado).
      #    - Lee la configuración de sonar-project.properties.
      #    - SONAR_TOKEN (secret del repo) autentica contra SonarCloud.
      #    - SONAR_HOST_URL apunta a la nube de SonarCloud.
      #    - qualitygate.wait=true hace que el job ESPERE el veredicto del
      #      Quality Gate y FALLE si el gate no pasa (Bugs/Vulnerabilities
      #      nuevos o coverage < 80%). Eso, sumado a la branch protection,
      #      bloquea el botón Merge en el PR.
      - name: Analisis de SonarQube Cloud
        uses: SonarSource/sonarqube-scan-action@v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: >
            -Dsonar.qualitygate.wait=true

      # 8. Publicar el reporte HTML como artifact.
      #    !cancelled() = también se publica si fallan los tests o el gate.
      - name: Publicar reporte HTML
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
          if-no-files-found: error
